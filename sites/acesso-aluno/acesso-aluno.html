<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enhydra</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%236366f1'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'>L</text></svg>">
    <link rel="stylesheet" href="style-acesso-aluno.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Digite o código da instituição</h2>
            </div>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <button type="submit" class="btn-avancar">
                    <span class="btn-circle"> <img src="../outras/seta.png"></span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            
        </div>
    </div>

    <script src="form-utils.js"></script>
    <script src="script-login.js"></script>
</body>
</html>
