<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação - Enhydra</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%236366f1'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'>L</text></svg>">
    <link rel="stylesheet" href="style-login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Recuperar senha</h2>
            </div>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <div class="input-wrapper">
                         <input type="password" id="password" name="password" placeholder=" " required>
                        <label for="email">Nova senha</label>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" name="password" placeholder=" " required>
                        <label for="password">Confirme a senha</label>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <span class="eye-icon"></span>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

               

                <button type="submit" class="btn-avancar">
                    <span class="btn-circle"> <img src="../outras/seta.png"></span>
                    <span class="btn-loader"></span>
                </button>
            </form>


            <div class="success-message" id="successMessage">
                <div class="success-icon">✓</div>
                <h3>Login</h3>
                <p>Redirecionando para a página inicial...</p>
            </div>
        </div>
    </div>

    <script src="form-utils.js"></script>
    <script src="script-login.js"></script>
</body>
</html>
